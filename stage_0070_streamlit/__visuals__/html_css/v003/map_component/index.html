<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #e8eef5; }
    #root { width: 100%; height: 100%; }
  </style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  function sendMessageToStreamlitClient(type, data) {
    var outData = Object.assign({ isStreamlitMessage: true, type: type }, data);
    window.parent.postMessage(outData, "*");
  }

  function init() {
    sendMessageToStreamlitClient("streamlit:componentReady", { apiVersion: 1 });
  }

  function setFrameHeight(height) {
    sendMessageToStreamlitClient("streamlit:setFrameHeight", { height: height });
  }

  function sendDataToPython(value) {
    sendMessageToStreamlitClient("streamlit:setComponentValue", {
      value: value,
      dataType: "json",
    });
  }

  function bind(root) {
    root.querySelectorAll(".zone-hit[data-zona]").forEach(function (el) {
      el.style.cursor = "pointer";
      el.addEventListener("click", function () {
        sendDataToPython({
          action: "zone",
          zona: el.getAttribute("data-zona"),
          page: 0,
          t: Date.now(),
        });
      });
    });
    root.querySelectorAll(".cam-card[data-cam]").forEach(function (el) {
      el.addEventListener("click", function () {
        sendDataToPython({
          action: "cam",
          cam: el.getAttribute("data-cam"),
          zona: el.getAttribute("data-zona") || "",
          t: Date.now(),
        });
      });
    });
    root.querySelectorAll(".pager-dot[data-page]").forEach(function (el) {
      el.addEventListener("click", function () {
        sendDataToPython({
          action: "page",
          zona: el.getAttribute("data-zona"),
          page: parseInt(el.getAttribute("data-page"), 10) || 0,
          t: Date.now(),
        });
      });
    });
    root.querySelectorAll("img[data-fallback]").forEach(function (img) {
      img.addEventListener("error", function () {
        img.src = img.getAttribute("data-fallback");
      });
    });
  }

  function onDataFromPython(event) {
    if (!event.data || event.data.type !== "streamlit:render") return;
    var args = event.data.args || {};
    var root = document.getElementById("root");
    root.innerHTML = args.html || "";
    bind(root);
    setFrameHeight(args.height || 680);
  }

  window.addEventListener("message", onDataFromPython);
  init();
  setFrameHeight(680);
})();
</script>
</body>
</html>
